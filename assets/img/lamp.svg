<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6bd"/>
      <stop offset="20%" stop-color="#eac266"/>
      <stop offset="50%" stop-color="#c89635"/>
      <stop offset="80%" stop-color="#fdf0cd"/>
      <stop offset="100%" stop-color="#6e4c0d"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c6418"/>
      <stop offset="35%" stop-color="#f5cf73"/>
      <stop offset="70%" stop-color="#ffea9f"/>
      <stop offset="100%" stop-color="#996f1b"/>
    </linearGradient>
    <linearGradient id="turquoiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bf5ff"/>
      <stop offset="40%" stop-color="#00d2d3"/>
      <stop offset="80%" stop-color="#008b94"/>
      <stop offset="100%" stop-color="#00474c"/>
    </linearGradient>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7bf5ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#00d2d3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#008b94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Aura behind lamp -->
  <ellipse cx="300" cy="220" rx="270" ry="140" fill="url(#lampAura)" />

  <g filter="url(#softShadow)">
    <!-- Pedestal Base -->
    <ellipse cx="300" cy="340" rx="90" ry="20" fill="url(#goldGrad1)" stroke="#593b05" stroke-width="2.5"/>
    <path d="M220,340 C235,312 265,302 272,290 L328,290 C335,302 365,312 380,340 Z" fill="url(#goldGrad2)" stroke="#593b05" stroke-width="2"/>
    <ellipse cx="300" cy="290" rx="30" ry="8" fill="url(#goldGrad1)" stroke="#593b05" stroke-width="1.5"/>

    <!-- Pedestal Jewels -->
    <path d="M250,330 Q300,342 350,330" fill="none" stroke="#fff4b8" stroke-width="2.5" opacity="0.85"/>
    <circle cx="275" cy="333" r="3.5" fill="#00f2fe" stroke="#5c3f08" stroke-width="1"/>
    <circle cx="300" cy="336" r="4" fill="#00f2fe" stroke="#5c3f08" stroke-width="1"/>
    <circle cx="325" cy="333" r="3.5" fill="#00f2fe" stroke="#5c3f08" stroke-width="1"/>

    <!-- Handle on LEFT (Exact match to TikTok screenshot) -->
    <path d="M170,195 
             C125,185 70,195 50,240 
             C35,275 60,310 100,320 
             C130,327 155,310 160,290 
             C165,275 155,260 140,260 
             C128,260 120,270 122,280 
             C125,295 110,305 90,298 
             C70,290 60,265 72,240 
             C85,210 125,205 165,212 Z" 
          fill="url(#goldGrad1)" stroke="#5c3f08" stroke-width="2.5"/>
    
    <!-- Handle flourish leaf -->
    <path d="M60,230 C40,220 25,205 30,195 C35,185 50,190 65,210 Z" fill="url(#goldGrad2)" stroke="#5c3f08" stroke-width="1.5"/>

    <!-- Main Lamp Belly Body -->
    <path d="M325,290 
             C390,285 440,250 460,210 
             C480,170 480,130 510,110 
             C525,100 550,95 560,95 
             C565,95 570,105 555,115 
             C515,140 500,185 460,225
             C425,260 385,275 325,275 
             L275,275 
             C215,275 175,245 160,205 
             C150,180 165,160 220,165 
             C275,170 310,175 330,175 
             C345,175 360,165 360,155 
             C360,145 340,140 300,140 
             C255,140 220,145 180,160 
             C160,168 145,180 140,200 
             C130,240 180,285 275,290 Z" 
          fill="url(#goldGrad1)" stroke="#5c3f08" stroke-width="2.5" />

    <!-- Upper Body Contour -->
    <path d="M460,210 C420,255 360,270 300,270 C240,270 185,245 165,210 C210,230 270,240 320,240 C390,240 435,225 460,210 Z" 
          fill="url(#goldGrad2)" opacity="0.65"/>

    <!-- Lamp Spout on RIGHT (Exact match to TikTok screenshot) -->
    <path d="M560,95 C570,95 575,100 575,106 C575,114 555,118 535,118 C490,118 465,165 430,200 L440,210 C475,170 505,125 550,118 C562,116 568,112 568,106 C568,102 564,99 558,98 Z" 
          fill="url(#goldGrad1)" stroke="#5c3f08" stroke-width="1.5"/>

    <!-- Spout Opening on RIGHT (where smoke puffs out!) -->
    <ellipse cx="568" cy="103" rx="10" ry="6" transform="rotate(25 568 103)" fill="#2a1a02" stroke="url(#goldGrad1)" stroke-width="2.5"/>
    <ellipse cx="568" cy="103" rx="7" ry="3.5" transform="rotate(25 568 103)" fill="#00f2fe" opacity="0.9" filter="url(#goldGlow)"/>

    <!-- Lamp Lid / Dome Top -->
    <path d="M260,145 C260,125 280,105 300,105 C320,105 340,125 340,145 Z" fill="url(#goldGrad2)" stroke="#5c3f08" stroke-width="2"/>
    <ellipse cx="300" cy="145" rx="44" ry="11" fill="url(#goldGrad1)" stroke="#5c3f08" stroke-width="2"/>
    
    <!-- Lid Finial with Turquoise Jewel (Exact match to screenshot!) -->
    <path d="M296,105 L296,85 C290,85 288,80 295,75 C298,70 300,60 300,55 C300,60 302,70 305,75 C312,80 310,85 304,85 L304,105 Z" 
          fill="url(#goldGrad1)" stroke="#5c3f08" stroke-width="1.5"/>
    <circle cx="300" cy="53" r="6" fill="url(#turquoiseGrad)" stroke="#e5b851" stroke-width="1.5" filter="url(#goldGlow)"/>

    <!-- Arabesque Engravings & Central Turquoise Jewel on Belly -->
    <g>
      <!-- Central Oval Medallion Frame with gold beaded relief -->
      <ellipse cx="300" cy="225" rx="38" ry="26" fill="#1c1303" stroke="url(#goldGrad1)" stroke-width="3.5"/>
      <!-- Glowing Turquoise Jewel in Center -->
      <ellipse cx="300" cy="225" rx="32" ry="20" fill="url(#turquoiseGrad)"/>
      <ellipse cx="300" cy="225" rx="36" ry="24" fill="url(#gemGlow)"/>
      <!-- Jewel Facet Highlights -->
      <polygon points="300,208 322,225 300,242 278,225" fill="none" stroke="#b5ffff" stroke-width="1.8" opacity="0.8"/>
      <ellipse cx="292" cy="218" rx="9" ry="4" transform="rotate(-20 292 218)" fill="#ffffff" opacity="0.7"/>

      <!-- Ornate scrolls flanking the jewel -->
      <path d="M260,225 C230,220 205,200 180,210 C190,225 220,240 262,233" fill="none" stroke="url(#goldGrad1)" stroke-width="2.5"/>
      <path d="M340,225 C370,220 395,200 420,210 C410,225 380,240 338,233" fill="none" stroke="url(#goldGrad1)" stroke-width="2.5"/>
      
      <circle cx="215" cy="216" r="3.5" fill="#00f2fe" stroke="#5c3f08" stroke-width="1"/>
      <circle cx="385" cy="216" r="3.5" fill="#00f2fe" stroke="#5c3f08" stroke-width="1"/>
      
      <!-- Upper rim bead pearls -->
      <circle cx="265" cy="155" r="2.5" fill="#ffeaa7"/>
      <circle cx="280" cy="157" r="2.5" fill="#ffeaa7"/>
      <circle cx="295" cy="158" r="2.5" fill="#ffeaa7"/>
      <circle cx="310" cy="158" r="2.5" fill="#ffeaa7"/>
      <circle cx="325" cy="157" r="2.5" fill="#ffeaa7"/>
      <circle cx="340" cy="155" r="2.5" fill="#ffeaa7"/>
    </g>

    <!-- Highlights & Shine effects -->
    <path d="M430,220 C380,250 320,255 270,253" fill="none" stroke="#fff9d6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M540,110 C510,120 480,150 455,185" fill="none" stroke="#fff9d6" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>