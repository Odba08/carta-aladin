<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02141a"/>
      <stop offset="50%" stop-color="#052733"/>
      <stop offset="100%" stop-color="#0a3b4a"/>
    </linearGradient>
    <linearGradient id="palaceGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#e5b851" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c89635" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#543c10" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="duneGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a3845"/>
      <stop offset="100%" stop-color="#03161c"/>
    </linearGradient>
    <linearGradient id="duneGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e4b5c"/>
      <stop offset="100%" stop-color="#051f26"/>
    </linearGradient>
    <radialGradient id="palaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffb834" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#052733" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd56b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#052733" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="600" fill="url(#skyGrad)"/>

  <!-- Golden Crescent Moon -->
  <g transform="translate(950, 110)">
    <circle cx="0" cy="0" r="50" fill="url(#moonGlow)" opacity="0.6"/>
    <path d="M-15,-35 A40,40 0 1 0 35,25 A32,32 0 1 1 -15,-35 Z" fill="#fff5cc" filter="drop-shadow(0 0 12px #ffeaa7)"/>
  </g>

  <!-- Palace Ambient Glow -->
  <ellipse cx="600" cy="320" rx="350" ry="220" fill="url(#palaceGlow)"/>

  <!-- Distant Background Palace Silhouette -->
  <g fill="url(#palaceGold)" opacity="0.95" filter="drop-shadow(0 0 15px rgba(255,213,107,0.4))">
    <!-- Center Grand Dome -->
    <!-- Onion Dome Path -->
    <path d="M560,260 
             C560,200 575,160 600,120 
             C625,160 640,200 640,260 
             Z" />
    <path d="M598,120 L598,90 L602,90 L602,120 Z" />
    <!-- Crescent atop center dome -->
    <circle cx="600" cy="85" r="6" fill="#ffeaa7"/>
    <rect x="560" y="260" width="80" height="80" rx="4"/>
    <!-- Grand Arched Portal -->
    <path d="M580,340 L580,295 C580,285 590,278 600,270 C610,278 620,285 620,295 L620,340 Z" fill="#04161c"/>

    <!-- Left Flanking Dome -->
    <path d="M475,270 C475,225 488,190 505,160 C522,190 535,225 535,270 Z"/>
    <path d="M504,160 L504,140 L506,140 L506,160 Z"/>
    <circle cx="505" cy="136" r="4" fill="#ffeaa7"/>
    <rect x="475" y="270" width="60" height="70" rx="3"/>
    <path d="M490,340 L490,305 C490,295 505,290 505,290 C505,290 520,295 520,305 L520,340 Z" fill="#04161c"/>

    <!-- Right Flanking Dome -->
    <path d="M665,270 C665,225 678,190 695,160 C712,190 725,225 725,270 Z"/>
    <path d="M694,160 L694,140 L696,140 L696,160 Z"/>
    <circle cx="695" cy="136" r="4" fill="#ffeaa7"/>
    <rect x="665" y="270" width="60" height="70" rx="3"/>
    <path d="M680,340 L680,305 C680,295 695,290 695,290 C695,290 710,295 710,305 L710,340 Z" fill="#04161c"/>

    <!-- Left Outer Minaret Tower -->
    <rect x="410" y="220" width="22" height="130" rx="2"/>
    <path d="M405,220 L437,220 L421,175 Z"/>
    <path d="M420,175 L420,160 L422,160 L422,175 Z"/>
    <circle cx="421" cy="157" r="3" fill="#ffeaa7"/>

    <!-- Far Left Minaret Tower -->
    <rect x="340" y="250" width="18" height="100" rx="2"/>
    <path d="M336,250 L362,250 L349,215 Z"/>

    <!-- Right Outer Minaret Tower -->
    <rect x="768" y="220" width="22" height="130" rx="2"/>
    <path d="M763,220 L795,220 L779,175 Z"/>
    <path d="M778,175 L778,160 L780,160 L780,175 Z"/>
    <circle cx="779" cy="157" r="3" fill="#ffeaa7"/>

    <!-- Far Right Minaret Tower -->
    <rect x="842" y="250" width="18" height="100" rx="2"/>
    <path d="M838,250 L864,250 L851,215 Z"/>

    <!-- Connecting Walls & Battlements -->
    <rect x="340" y="320" width="520" height="40"/>
    <!-- Crenellations / Parapets -->
    <path d="M350,315 h10 v5 h-10 z M370,315 h10 v5 h-10 z M390,315 h10 v5 h-10 z M440,315 h10 v5 h-10 z M460,315 h10 v5 h-10 z M540,315 h10 v5 h-10 z M650,315 h10 v5 h-10 z M730,315 h10 v5 h-10 z M750,315 h10 v5 h-10 z M800,315 h10 v5 h-10 z M820,315 h10 v5 h-10 z" />
  </g>

  <!-- Rolling Sand Dunes Layer 1 (Midground) -->
  <path d="M-50,420 Q250,330 550,380 T1150,360 Q1250,370 1300,410 L1300,600 L-50,600 Z" fill="url(#duneGrad1)"/>

  <!-- Rolling Sand Dunes Layer 2 (Foreground) -->
  <path d="M-50,460 Q300,430 650,490 T1250,430 L1250,600 L-50,600 Z" fill="url(#duneGrad2)"/>
  
  <!-- Subtle dune ridge highlights in turquoise-gold -->
  <path d="M-20,460 Q300,430 650,490" fill="none" stroke="#258da6" stroke-width="2" opacity="0.4"/>
  <path d="M650,490 Q950,440 1250,430" fill="none" stroke="#258da6" stroke-width="2" opacity="0.4"/>
</svg>