<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dressTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#00b4d8"/>
      <stop offset="70%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>
    <linearGradient id="dressGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6bd"/>
      <stop offset="40%" stop-color="#eac266"/>
      <stop offset="80%" stop-color="#c89635"/>
      <stop offset="100%" stop-color="#8c6418"/>
    </linearGradient>
    <filter id="dressShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#dressShadow)">
    <!-- Hanger Hook (Gold) -->
    <path d="M150,35 C150,20 165,15 170,25 C175,35 160,45 150,55 L150,70" fill="none" stroke="url(#dressGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M90,75 L150,70 L210,75" fill="none" stroke="url(#dressGold)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Off-shoulder Gold Filigree Straps & Sleeves -->
    <path d="M95,85 C75,95 65,115 75,130 C85,120 95,100 110,95 Z" fill="url(#dressGold)"/>
    <path d="M205,85 C225,95 235,115 225,130 C215,120 205,100 190,95 Z" fill="url(#dressGold)"/>

    <!-- Bodice (Corset estilo Jazmín con pedrería dorada) -->
    <path d="M110,92 
             C125,85 150,95 150,95 
             C150,95 175,85 190,92 
             L180,165 
             C165,175 135,175 120,165 Z" 
          fill="url(#dressTeal)" stroke="url(#dressGold)" stroke-width="2.5"/>

    <!-- Central Royal Gold Neckline Jewel -->
    <circle cx="150" cy="100" r="7" fill="url(#dressGold)"/>
    <circle cx="150" cy="100" r="4.5" fill="#7bf5ff"/>

    <!-- Gold Embroidered Ribs on Bodice -->
    <path d="M125,100 L135,168 M175,100 L165,168 M150,110 L150,172" stroke="url(#dressGold)" stroke-width="1.8" opacity="0.8"/>

    <!-- Golden Waistband / Belt -->
    <path d="M118,165 C135,175 165,175 182,165 L184,180 C165,190 135,190 116,180 Z" fill="url(#dressGold)" stroke="#6e4c0d" stroke-width="1"/>
    <polygon points="150,170 156,180 150,190 144,180" fill="#00f2fe" stroke="url(#dressGold)" stroke-width="1"/>

    <!-- Flowing Cocktail Skirt (Vaporosa y brillante) -->
    <path d="M116,180 
             C135,190 165,190 184,180 
             C215,225 240,290 250,380 
             C210,405 150,410 50,380 
             C60,290 85,225 116,180 Z" 
          fill="url(#dressTeal)" stroke="url(#dressGold)" stroke-width="2"/>

    <!-- Outer Sheer Peplum / Chiffon Swags (Estilo Princesa Árabe) -->
    <path d="M116,180 C100,220 90,270 120,290 C140,260 145,210 150,188 Z" fill="#7bf5ff" opacity="0.35"/>
    <path d="M184,180 C200,220 210,270 180,290 C160,260 155,210 150,188 Z" fill="#7bf5ff" opacity="0.35"/>

    <!-- Skirt Center Drape & Golden Hem Embroidery -->
    <path d="M150,188 C145,260 140,340 150,405" stroke="url(#dressGold)" stroke-width="2" stroke-dasharray="4,3" opacity="0.8"/>
    <path d="M50,380 C100,400 150,410 250,380" fill="none" stroke="url(#dressGold)" stroke-width="4"/>
    <path d="M60,370 C105,390 150,400 240,370" fill="none" stroke="url(#dressGold)" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Sparkling Stars on Skirt -->
    <circle cx="100" cy="310" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="200" cy="325" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="140" cy="360" r="3" fill="#ffeaa7" opacity="0.9"/>
    <circle cx="170" cy="270" r="2" fill="#fff" opacity="0.8"/>
  </g>
</svg>