<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="suitTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#053c4d"/>
      <stop offset="50%" stop-color="#0a536b"/>
      <stop offset="100%" stop-color="#021c24"/>
    </linearGradient>
    <linearGradient id="shirtIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5efe1"/>
      <stop offset="100%" stop-color="#dfd6c3"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6bd"/>
      <stop offset="40%" stop-color="#eac266"/>
      <stop offset="80%" stop-color="#c89635"/>
      <stop offset="100%" stop-color="#8c6418"/>
    </linearGradient>
    <filter id="suitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#suitShadow)">
    <!-- Hanger Hook (Gold) -->
    <path d="M150,35 C150,20 165,15 170,25 C175,35 160,45 150,55 L150,70" fill="none" stroke="url(#goldAcc)" stroke-width="3" stroke-linecap="round"/>
    <path d="M80,78 L150,70 L220,78" fill="none" stroke="url(#goldAcc)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Mandarin Collar / Inner Shirt -->
    <path d="M130,85 C130,75 170,75 170,85 L165,115 L135,115 Z" fill="url(#shirtIvory)" stroke="url(#goldAcc)" stroke-width="1.5"/>
    <polygon points="140,90 150,110 160,90" fill="none" stroke="url(#goldAcc)" stroke-width="1.5"/>

    <!-- Royal Aladdin Vest / Blazer Body (Turquoise Teal & Gold Brocade) -->
    <path d="M85,82 
             L130,85 L145,155 L155,155 L170,85 L215,82 
             L225,180 L220,240 
             L175,250 L150,235 L125,250 
             L80,240 L75,180 Z" 
          fill="url(#suitTeal)" stroke="url(#goldAcc)" stroke-width="2.5"/>

    <!-- Sleeves (White / Ivory Linen Silk) -->
    <path d="M85,82 L60,180 L80,185 L95,110 Z" fill="url(#shirtIvory)" stroke="#b5a995" stroke-width="1"/>
    <path d="M215,82 L240,180 L220,185 L205,110 Z" fill="url(#shirtIvory)" stroke="#b5a995" stroke-width="1"/>
    <!-- Gold Cuffs -->
    <rect x="58" y="175" width="24" height="10" rx="2" fill="url(#goldAcc)"/>
    <rect x="218" y="175" width="24" height="10" rx="2" fill="url(#goldAcc)"/>

    <!-- Ornate Golden Lapels & Embroidered Chest Borders -->
    <path d="M85,82 L135,85 L148,160 L135,160 L100,120 Z" fill="url(#goldAcc)"/>
    <path d="M215,82 L165,85 L152,160 L165,160 L200,120 Z" fill="url(#goldAcc)"/>

    <!-- Central Gold Buttons -->
    <circle cx="150" cy="170" r="3.5" fill="url(#goldAcc)"/>
    <circle cx="150" cy="190" r="3.5" fill="url(#goldAcc)"/>
    <circle cx="150" cy="210" r="3.5" fill="url(#goldAcc)"/>

    <!-- Royal Waist Sash / Belt (Faja estilo Príncipe Alí) -->
    <rect x="110" y="235" width="80" height="20" rx="3" fill="url(#goldAcc)" stroke="#6e4c0d" stroke-width="1.2"/>
    <polygon points="150,230 160,245 150,260 140,245" fill="#00f2fe" stroke="#fff" stroke-width="1.2"/>

    <!-- Tailored Linen Trousers (Pantalón de lino cóctel fresco) -->
    <path d="M112,255 
             L188,255 
             L198,390 L165,395 
             L150,305 
             L135,395 L102,390 Z" 
          fill="url(#shirtIvory)" stroke="#b5a995" stroke-width="1.5"/>

    <!-- Trousers Crease lines & Golden hem trim -->
    <line x1="120" y1="260" x2="118" y2="390" stroke="#cfc5b4" stroke-width="1.2"/>
    <line x1="180" y1="260" x2="182" y2="390" stroke="#cfc5b4" stroke-width="1.2"/>
    <rect x="102" y="385" width="33" height="7" rx="2" fill="url(#goldAcc)"/>
    <rect x="165" y="385" width="33" height="7" rx="2" fill="url(#goldAcc)"/>
  </g>
</svg>